{% extends "base.html" %}

{% block title %}
Apply for Work - BuildSync
{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-100 py-20 px-4">

    <div class="max-w-3xl mx-auto">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <div class="text-center mb-8">

                <div class="w-16 h-16 mx-auto bg-orange-100 rounded-full flex items-center justify-center">

                    <i class="fa-solid fa-briefcase text-orange-500 text-2xl"></i>

                </div>

                <h1 class="text-3xl font-bold text-gray-800 mt-4">
                    Apply for Work
                </h1>

                <p class="text-gray-500 mt-2">
                    Tell us about yourself and the work you can do.
                </p>

            </div>


            <form method="POST" class="space-y-5">

                {% csrf_token %}

                {{ form.as_p }}


                <button
                    type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">

                    Submit Application

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
