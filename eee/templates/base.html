{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BuildSync{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>


<body class="bg-slate-100">


    <!-- NAVBAR -->

    <nav class="fixed top-0 left-0 w-full z-50 bg-orange-300 shadow-md">

        <div class="flex justify-between items-center p-4">


            <!-- LEFT -->

            <div class="flex gap-4 items-center ml-32">

                <img
                    src="{% static 'image/logo-circle.webp' %}"
                    alt="BuildSync"
                    class="h-10 w-10 rounded-full"
                >


                <a
                    href="{% url 'userdashboard' %}"
                    class="px-4 py-2 rounded-full hover:bg-orange-500 hover:text-white transition"
                >
                    Home
                </a>

            </div>


            <!-- RIGHT -->

            <div class="flex gap-4 items-center mr-32">


                <!-- APPLY FOR WORK -->

                <a
                    href="{% url 'apply_work' %}"
                    class="px-4 py-2 rounded-full bg-green-500 text-white hover:bg-green-600 transition"
                >

                    <i class="fa-solid fa-briefcase mr-1"></i>

                    Apply for Work

                </a>


                <!-- MY TASKS -->

                <a
                    href="{% url 'my_tasks' %}"
                    class="px-4 py-2 rounded-full hover:bg-orange-500 hover:text-white transition"
                >
                    My Tasks
                </a>


                <!-- PROJECTS -->

                <a
                    href="{% url 'projects' %}"
                    class="px-4 py-2 rounded-full hover:bg-orange-500 hover:text-white transition"
                >
                    Projects
                </a>


                <!-- ACTIVITY -->

                <a
                    href="{% url 'activity' %}"
                    class="px-4 py-2 rounded-full hover:bg-orange-500 hover:text-white transition"
                >
                    Activity
                </a>


                <!-- PROFILE -->

                <a
                    href="{% url 'profile' %}"
                    class="px-4 py-2 rounded-full hover:bg-orange-500 hover:text-white transition"
                >
                    Profile
                </a>


                <!-- LOGOUT -->

                <a
                    href="{% url 'logout' %}"
                    class="px-4 py-2 rounded-full bg-red-500 text-white hover:bg-red-600 transition"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- PAGE CONTENT -->

    <main class="pt-20">

        {% block content %}
        {% endblock content %}

    </main>


    <!-- FOOTER -->

    {% include "footer.html" %}


</body>

</html>
