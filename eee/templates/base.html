{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}BuildSync{% endblock %}
    </title>


    <!-- Tailwind CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body class="bg-slate-100 overflow-x-hidden">


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<nav
    class="fixed
           top-0
           left-0
           w-full
           z-50
           bg-orange-300
           shadow-md"
>

    <div
        class="w-full

               flex
               items-center
               justify-between

               px-2
               sm:px-4
               md:px-8
               lg:px-12
               xl:px-20

               py-3
               lg:py-4"
    >


        <!-- ================================================= -->
        <!-- LEFT SIDE -->
        <!-- ================================================= -->

        <div
            class="flex
                   items-center

                   gap-2
                   sm:gap-3
                   lg:gap-6
                   xl:gap-8

                   shrink-0"
        >


            <!-- ================================================= -->
            <!-- LOGO -->
            <!-- ================================================= -->

            <a
                href="{% url 'userdashboard' %}"
            >

                <img
                    src="{% static 'image/logo-circle.webp' %}"
                    alt="BuildSync"

                    class="w-8
                           h-8

                           sm:w-9
                           sm:h-9

                           lg:w-10
                           lg:h-10

                           rounded-full

                           cursor-pointer

                           hover:scale-105

                           transition"
                >

            </a>



            <!-- ================================================= -->
            <!-- HOME -->
            <!-- ================================================= -->

            <a
                href="{% url 'userdashboard' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       hover:bg-orange-500
                       hover:text-white

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                Home

            </a>

        </div>



        <!-- ================================================= -->
        <!-- RIGHT SIDE -->
        <!-- ================================================= -->

        <div
            class="flex
                   items-center

                   gap-0.5
                   sm:gap-2
                   md:gap-3
                   lg:gap-5
                   xl:gap-7

                   shrink-0"
        >


            <!-- ================================================= -->
            <!-- APPLY FOR WORK -->
            <!-- ================================================= -->

            <a
                href="{% url 'apply_work' %}"

                class="flex
                       items-center
                       justify-center

                       px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       bg-green-500

                       text-white

                       hover:bg-green-600

                       transition

                       text-[10px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                <i
                    class="fa-solid
                           fa-briefcase

                           mr-1

                           text-[10px]
                           sm:text-xs
                           lg:text-sm"
                ></i>

                Apply for Work

            </a>



            <!-- ================================================= -->
            <!-- MY TASKS -->
            <!-- ================================================= -->

            <a
                href="{% url 'my_tasks' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       hover:bg-orange-500
                       hover:text-white

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                My Tasks

            </a>



            <!-- ================================================= -->
            <!-- PROJECTS -->
            <!-- ================================================= -->

            <a
                href="{% url 'projects' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       hover:bg-orange-500
                       hover:text-white

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                Projects

            </a>



            <!-- ================================================= -->
            <!-- ACTIVITY -->
            <!-- ================================================= -->

            <a
                href="{% url 'activity' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       hover:bg-orange-500
                       hover:text-white

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                Activity

            </a>



            <!-- ================================================= -->
            <!-- PROFILE -->
            <!-- ================================================= -->

            <a
                href="{% url 'profile' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       hover:bg-orange-500
                       hover:text-white

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                Profile

            </a>



            <!-- ================================================= -->
            <!-- LOGOUT -->
            <!-- ================================================= -->

            <a
                href="{% url 'logout' %}"

                class="px-1.5
                       sm:px-3
                       lg:px-4

                       py-1.5
                       sm:py-2

                       rounded-full

                       bg-red-500

                       text-white

                       hover:bg-red-600

                       transition

                       text-[11px]
                       sm:text-sm
                       lg:text-base

                       whitespace-nowrap"
            >

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- ===================================================== -->
<!-- PAGE CONTENT -->
<!-- ===================================================== -->

<main
    class="pt-16
           sm:pt-18
           lg:pt-20"
>

    {% block content %}

    {% endblock content %}

</main>



<!-- ===================================================== -->
<!-- FOOTER -->
<!-- ===================================================== -->

{% include "footer.html" %}


</body>

</html>
