{% extends "admindashboard.html" %}

{% block content %}

<div class="bg-slate-100 min-h-screen pt-20 px-10">

    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">

        <h1 class="text-3xl font-bold text-center mb-8">
            Assign Work
        </h1>


        <!-- Selected User -->

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-5 mb-6">

            <h2 class="text-xl font-semibold text-blue-700 mb-3">
                Selected User
            </h2>

            <p class="text-lg">
                <strong>Username:</strong>
                {{ user.username }}
            </p>

            <p class="text-lg">
                <strong>Email:</strong>
                {{ user.email }}
            </p>

        </div>


        <!-- Work Form -->

        <form method="POST">

            {% csrf_token %}

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Work Name
                </label>

                <input
                    type="text"
                    name="work_name"
                    placeholder="Enter work name"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    required
                >

            </div>


            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Work Description
                </label>

                <textarea
                    name="description"
                    rows="4"
                    placeholder="Enter work details"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                ></textarea>

            </div>


            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="Enter work location"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                >

            </div>


            <div class="flex justify-between items-center">

                <a
                    href="{% url 'userlist' %}"
                    class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded-md"
                >
                    Back
                </a>


                <button
                    type="submit"
                    class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2 rounded-md"
                >
                    Assign Work
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock content %}
