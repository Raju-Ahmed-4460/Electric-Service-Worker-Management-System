{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-4xl mx-auto mt-10">
        
        <h1 class="text-3xl font-bold text-center mb-8">
            User List
        </h1>

        <div class="bg-white shadow-lg rounded-lg overflow-hidden">

            <div class="grid grid-cols-4 bg-gray-800 text-white font-semibold p-4">
                <p>Username</p>
                <p>Email</p>
                <p>Group Name</p>
                <p>Assign Group</p>
                
            </div>

            {% for us in user %}
            <div class="grid grid-cols-4 p-4 border-b hover:bg-gray-50 transition">
                <p class="font-medium text-gray-800">
                    {{ us.username }}
                </p>

                <p class="text-gray-600">
                    {{ us.email }}
                </p>
                 <p class="text-gray-600">
                  {% for group in us.groups.all %}
                    {{ group.name }} 
                   {% empty %}
                     No Group
                    {% endfor %}
                    </p>

                    <a href="{% url 'assigngroup' us.id %}"
                   class="bg-green-500 text-white px-3 py-1 rounded-md text-center hover:bg-green-600 transition block">
                    Change Role
                       </a>
            </div>
            {% empty %}
            <div class="p-4 text-center text-gray-500">
                No users found.
            </div>
            {% endfor %}

        </div>

    </div>

</body>
</html>
