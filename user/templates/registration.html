{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-green-100 flex items-center justify-center px-4">

```
<div class="w-full max-w-md">

    <div class="bg-white rounded-2xl shadow-2xl p-8">

        <!-- Header -->
        <div class="text-center mb-7">

            <h1 class="text-3xl font-bold text-gray-800">
                Create Account
            </h1>

            <p class="text-gray-500 mt-2">
                Register a new account
            </p>

        </div>


        <!-- Registration Form -->
        <form method="POST" action="{% url 'registration' %}">

            {% csrf_token %}

            <div class="space-y-4">

                {{ form.as_p }}

            </div>


            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full mt-6 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl shadow-md hover:shadow-lg transition duration-200"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->
        <div class="text-center mt-7 pt-5 border-t border-gray-100">

            <p class="text-sm text-gray-500">
                Already have an account?
            </p>

            <a
                href="{% url 'login' %}"
                class="inline-block mt-3 px-8 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold shadow-md hover:shadow-lg transition duration-200"
            >
                Login
            </a>

        </div>

    </div>

</div>
```

</body>
</html>
